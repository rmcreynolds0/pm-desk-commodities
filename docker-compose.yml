# docker-compose.yml — always-on paper stack for the CROSS-SECTIONAL (Pivot A)
# strategy. Runs with your laptop off.
#
#   ib-gateway-0..3 : ONE headless IB Gateway per agent, each logged into that
#                     agent's OWN IBKR paper account
#   engine          : scripts/xsec_scheduler.py -> rebalance (monthly, 10:30 ET)
#                     and mark (every weekday, 16:30 ET)
#   dashboard       : Streamlit live ledger view, localhost:8501 on the VM
#
# WHY FOUR GATEWAYS RATHER THAN ONE
# ---------------------------------
# IBKR caps a paper account at $1,000,000. Four agents sharing one account get
# (1e6 * 0.50) / (2 * 4 * 0.12) = $520,833 each, at which gold, heating oil,
# feeder cattle and copper round to zero contracts and drop out — four of the
# five markets whose removal was already tested and REJECTED (carry stopped
# beating chance). One account per agent removes the divisor entirely and
# yields $2,083,333 each, holding all 22 markets.
#
# A gateway is one login, so four accounts means four gateways.
#
# THE VM MUST BE x86-64 (amd64) WITH >= 8 GB RAM. IB Gateway has no ARM build,
# and each gateway is a JVM needing roughly 700 MB-1 GB. Four of them plus the
# engine and dashboard will not fit in 4 GB. See docs/DEPLOY.md §1.
#
# BRING-UP:  bash deploy/bootstrap.sh     (prompts for all four logins)
#
# WHY EACH HARDENING BLOCK EXISTS
#   logging limits   an always-on stack left unbounded fills a VM disk in
#                    weeks; a full disk stops the engine writing the ledger.
#   healthchecks     "container running" is not "gateway logged in". Without a
#                    real check the engine dials a socket that will not accept
#                    for another 90s and burns its retries.
#   init: true       PID 1 does not reap children; the engine spawns a job
#                    subprocess on every schedule tick.
#   stop_grace       let a rebalance finish rather than dying mid-order.

# --- shared gateway definition; each agent's service overrides only its login
x-gateway: &gateway
  image: ghcr.io/gnzsnz/ib-gateway:stable
  restart: unless-stopped
  env_file: .env
  healthcheck:
    # The API port only accepts once IBC has completed login. This is the
    # difference between "container up" and "actually usable".
    test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/4002' || exit 1"]
    interval: 30s
    timeout: 5s
    retries: 10
    start_period: 240s          # four gateways logging in at once are slower
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}

x-gateway-env: &gateway-env
  TRADING_MODE: paper           # NEVER change on this stack
  READ_ONLY_API: "no"           # we place (paper) orders
  TWOFA_TIMEOUT_ACTION: restart
  TZ: America/New_York

services:
  # Host ports are bound to 127.0.0.1 for debugging only; the engine reaches
  # the gateways by service name on the compose network, not through these.
  ib-gateway-0:
    <<: *gateway
    environment:
      <<: *gateway-env
      TWS_USERID: ${TWS_USERID_0:?set TWS_USERID_0 in .env}
      TWS_PASSWORD: ${TWS_PASSWORD_0:?set TWS_PASSWORD_0 in .env}
    ports: ["127.0.0.1:4002:4002"]

  # GATEWAYS 1-3 ARE PROFILE-GATED.
  # IBKR paper accounts take a day or two to open, so the stack must be able to
  # run a subset. `docker compose up -d` brings up agent_0 only; adding the
  # other logins to .env and running `docker compose --profile full up -d`
  # brings up the rest without touching agent_0's running book.
  #
  # Defaults are `:-` (empty) rather than `:?` (required) because compose
  # interpolates the WHOLE file even for services a profile excludes — `:?`
  # would refuse to start the one-agent stack over credentials it is not
  # going to use. deploy/bootstrap.sh validates what is actually needed.
  ib-gateway-1:
    <<: *gateway
    profiles: ["full"]
    environment:
      <<: *gateway-env
      TWS_USERID: ${TWS_USERID_1:-}
      TWS_PASSWORD: ${TWS_PASSWORD_1:-}
    ports: ["127.0.0.1:4012:4002"]

  ib-gateway-2:
    <<: *gateway
    profiles: ["full"]
    environment:
      <<: *gateway-env
      TWS_USERID: ${TWS_USERID_2:-}
      TWS_PASSWORD: ${TWS_PASSWORD_2:-}
    ports: ["127.0.0.1:4022:4002"]

  ib-gateway-3:
    <<: *gateway
    profiles: ["full"]
    environment:
      <<: *gateway-env
      TWS_USERID: ${TWS_USERID_3:-}
      TWS_PASSWORD: ${TWS_PASSWORD_3:-}
    ports: ["127.0.0.1:4032:4002"]

  engine:
    build: .
    restart: unless-stopped
    init: true
    depends_on:
      # Only gateway-0, because 1-3 are profile-gated and compose cannot wait
      # on a service its active profile excludes. Waiting for a REAL login
      # here (not merely a started container) still matters: it is the
      # difference between the engine dialling a live socket and burning its
      # retries on one that will not accept for another 90 seconds.
      #
      # The later gateways need no depends_on: the engine connects per agent
      # and SKIPS any agent whose gateway does not answer, so a rung that is
      # not up yet costs that rung, not the run.
      ib-gateway-0: {condition: service_healthy}
    # EXPLICIT, not inherited from the image CMD. The repo contains TWO
    # schedulers — scripts/scheduler.py drives the RETIRED natural-gas book and
    # scripts/xsec_scheduler.py drives the live cross-sectional one.
    command: python -u scripts/xsec_scheduler.py
    environment:
      # Per-agent gateway endpoints. These override config/xsec.yaml's
      # ibkr.gateways block, so the container topology is visible here rather
      # than only in the frozen spec.
      IBKR_HOST_AGENT_0: ib-gateway-0
      IBKR_HOST_AGENT_1: ib-gateway-1
      IBKR_HOST_AGENT_2: ib-gateway-2
      IBKR_HOST_AGENT_3: ib-gateway-3
      IBKR_PORT_AGENT_0: "4002"
      IBKR_PORT_AGENT_1: "4002"
      IBKR_PORT_AGENT_2: "4002"
      IBKR_PORT_AGENT_3: "4002"
      TZ: America/New_York               # scheduler compares against ET
      PYTHONUNBUFFERED: "1"
      # NOTE: no EIA/NOAA/FRED/R2 keys. The cross-sectional strategy takes its
      # signals from IBKR itself (both legs of the term structure plus a year
      # of bars). The R2 mirror was measured stale by 43-243 days per market,
      # so this stack has NO external data dependency at all.
    volumes:
      - ./data:/app/data                 # ledger + logs persist on the host
      - ./config:/app/config             # edit schedule/params without rebuild
    stop_grace_period: 60s               # never kill mid-rebalance
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "5"}

  dashboard:
    build: .
    restart: unless-stopped
    init: true
    # xsec_live.py reads the LIVE ledger (data/live/xsec_books.db).
    # Do NOT point this at dashboard/pivot_a.py — that renders BACKTEST CSVs,
    # and a page showing simulated results under a "live" heading is worse
    # than no page at all.
    command: >
      streamlit run dashboard/xsec_live.py
      --server.port 8501 --server.address 0.0.0.0
      --server.headless true
      --browser.gatherUsageStats false
      --server.fileWatcherType none
    environment:
      TZ: America/New_York
    ports:
      # BOUND TO LOCALHOST. The dashboard has no authentication, so it must not
      # be reachable from the public internet — reach it over an SSH tunnel
      # (docs/DEPLOY.md §5). Changing this to "8501:8501" publishes your full
      # trading record to anyone who port-scans the VM.
      - "127.0.0.1:8501:8501"
    volumes:
      - ./data:/app/data                 # read-only consumer of the ledger
      - ./config:/app/config
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health',timeout=4).status==200 else 1)\""]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}
