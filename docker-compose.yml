# docker-compose.yml — always-on paper stack for the CROSS-SECTIONAL (Pivot A)
# strategy, on one small VM. Runs with your laptop off.
#
#   ib-gateway : headless IB Gateway (paper) with IBC auto-login/auto-restart.
#                Community image, widely used for exactly this purpose.
#   engine     : scripts/xsec_scheduler.py -> rebalance (monthly, 10:30 ET)
#                and mark (every weekday, 16:30 ET)
#   dashboard  : Streamlit live ledger view, localhost:8501 on the VM
#
# THE VM MUST BE x86-64 (amd64). IB Gateway has no ARM build, so Oracle's free
# ARM tier and Raspberry Pi cannot run this stack at all. See docs/DEPLOY.md §1.
#
# BRING-UP (on the VM):
#   1. git clone the repo, then `cp .env.example .env` and fill in
#      TWS_USERID / TWS_PASSWORD (IBKR *paper* login).
#   2. docker compose up -d --build
#   3. SSH-tunnel to reach the dashboard:  ssh -L 8501:localhost:8501 <vm>
#
# NOTES
#   * The gateway image restarts the session nightly by itself; the engine's
#     connection retries (xsec.yaml ibkr.connect_retries) absorb that window.
#   * data/ is bind-mounted so xsec_books.db + logs survive rebuilds and can be
#     copied off the VM for analysis at summer's end.
#   * The engine reaches the gateway at host "ib-gateway", set below via the
#     IBKR_HOST env var, which xsec_engine.py reads in preference to xsec.yaml.

services:
  ib-gateway:
    image: ghcr.io/gnzsnz/ib-gateway:stable
    restart: unless-stopped
    environment:
      TWS_USERID: ${TWS_USERID}          # IBKR paper username (from .env)
      TWS_PASSWORD: ${TWS_PASSWORD}      # IBKR paper password (from .env)
      TRADING_MODE: paper                # NEVER change on this stack
      READ_ONLY_API: "no"                # we place (paper) orders
      TWOFA_TIMEOUT_ACTION: restart
    ports:
      - "127.0.0.1:4002:4002"           # localhost only — not exposed publicly

  engine:
    build: .
    restart: unless-stopped
    depends_on:
      - ib-gateway
    # EXPLICIT, not inherited from the image's CMD. The repo contains TWO
    # schedulers — scripts/scheduler.py drives the retired natural-gas book and
    # scripts/xsec_scheduler.py drives the live cross-sectional one. Naming the
    # command here means you can see which strategy this stack runs without
    # opening the Dockerfile.
    command: python -u scripts/xsec_scheduler.py
    environment:
      # Engine must dial the gateway CONTAINER, not localhost. xsec_engine.py
      # reads both of these and they override config/xsec.yaml's ibkr block.
      IBKR_HOST: ib-gateway
      IBKR_PORT: "4002"
      TZ: America/New_York               # scheduler logs in ET for sanity
      # NOTE: no EIA/NOAA/FRED/R2 keys. The cross-sectional strategy takes its
      # signals from IBKR itself (both legs of the term structure plus a year
      # of bars) — see the comment in xsec_engine.run_rebalance. The R2 mirror
      # was measured stale by 43-243 days per market and cannot drive live
      # decisions, so this stack has no external data dependency at all.
    volumes:
      - ./data:/app/data                 # ledger + logs persist on the host
      - ./config:/app/config             # edit schedule/params without rebuild

  dashboard:
    build: .
    restart: unless-stopped
    # xsec_live.py reads the LIVE ledger (data/live/xsec_books.db).
    # Do not point this at dashboard/pivot_a.py — that one renders BACKTEST
    # CSVs, and a page that shows simulated results under a "live" heading is
    # worse than no page.
    command: >
      streamlit run dashboard/xsec_live.py
      --server.port 8501 --server.address 0.0.0.0
      --server.headless true --browser.gatherUsageStats false
    depends_on:
      - engine
    ports:
      # BOUND TO LOCALHOST. The dashboard has no authentication, so it must not
      # be reachable from the public internet — reach it with an SSH tunnel
      # (see docs/DEPLOY.md §5). Changing this to "8501:8501" publishes your
      # full trading record to anyone who scans the VM's IP.
      - "127.0.0.1:8501:8501"
    volumes:
      - ./data:/app/data                 # read-only consumer of xsec_books.db
      - ./config:/app/config
